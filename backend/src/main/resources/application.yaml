spring:
  application:
    name: backend
  mongodb:
    uri: ${MONGODB_URI}
    database: gestion_cumpleanos
app:
  jwt:
    secret: ${JWT_SECRET}
  # Módulo 4 · fuentes de las cotizaciones (ver README, Módulo 4)
  cotizaciones:
    # Dólar MEP: API pública (dólar bolsa)
    dolar-mep-url: https://dolarapi.com/v1/dolares/bolsa
    # Nafta YPF: CSV "Precios en surtidor" (Secretaría de Energía, datos abiertos).
    # Vacío = se usa el precio cargado por un administrador.
    nafta-csv-url: ${NAFTA_CSV_URL:}
    nafta-provincia: CAPITAL FEDERAL
