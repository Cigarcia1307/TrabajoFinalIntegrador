server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:backend/.env[.properties],optional:file:.env[.properties]
  application:
    name: backend
  mongodb:
    uri: ${MONGODB_URI}
    database: gestion_cumpleanos
  data:
    mongodb:
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET}
  cotizaciones:
    dolar-mep-url: https://dolarapi.com/v1/dolares/bolsa
    nafta-csv-url: ${NAFTA_CSV_URL:http://datos.energia.gob.ar/dataset/1c181390-5045-475e-94dc-410429be4b17/resource/80ac25de-a44a-4445-9215-090cf55cfda5/download/precios-en-surtidor-resolucin-3142016.csv}
    nafta-provincia: CAPITAL FEDERAL